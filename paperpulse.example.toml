# PaperPulse configuration. Copy to paperpulse.toml and adapt.
# Secrets stay in the environment: PUBMED_EMAIL (recommended), NCBI_API_KEY (optional).

[profile]
# One focused topic per entry. Each paper is scored against every topic and
# keeps its best match, so several narrow topics beat one long paragraph.
topics = [
    "AI clinical decision support",
    "Tumor board decision support AI",
    "AI-assisted diagnosis",
    "Clinical outcome prediction",
    "NLP applied to clinical notes",
    "NLP for medical documentation and discharge summaries",
    "Information extraction from clinical text",
    "Electronic health record systems and EHR integration",
    "Health data interoperability standards",
    "FHIR implementation and clinical data exchange",
    "Digital therapeutics",
    "Real-world clinical AI applications",
    "Novel technical approaches enabling clinical AI",
]
# Free-text guidance for the LLM stage: what makes a paper worth your time.
preferences = """
Prefer original research that presents new methods, systems, datasets or evaluated results.
Perspectives, commentaries and studies that only survey attitudes towards AI are less useful.
"""

[sources.pubmed]
# Everything published in these journals is ingested.
journals = [
    "npj Digital Medicine",
    "Lancet Digital Health",
    "Journal of Medical Internet Research",
    "Journal of the American Medical Informatics Association",
    "Journal of Biomedical Informatics",
    "Patterns",
    "PLOS Digital Health",
]

[sources.pubmed.filtered]
# High-volume general journals: only papers matching a keyword are ingested.
journals = ["Nature Medicine", "New England Journal of Medicine", "JAMA"]
keywords = [
    "artificial intelligence",
    "machine learning",
    "deep learning",
    "large language model",
    "natural language processing",
    "digital health",
    "clinical decision support",
    "wearable",
    "electronic health record",
    "EHR",
    "mHealth",
    "telemedicine",
    "digital therapeutics",
]

[selection]
top = 3
window_days = 7      # consider papers added to PubMed in the last N days
no_repeat_days = 7   # don't pick papers selected in the last N days
# exclude_publication_types = [...]  # defaults to editorials, comments, errata, letters, ...
# exclude_title_prefixes = [...]     # defaults to "Correction:", "Erratum", "Retraction:", ...

[retrieval]
# Fuse BM25 keyword ranks with embedding ranks (reciprocal rank fusion).
# Keyword search catches exact terms like FHIR or OMOP that embeddings blur.
hybrid = true
rrf_k = 60

[embedding]
model = "pritamdeka/S-PubMedBert-MS-MARCO"

[llm]
# Each shortlisted paper is assessed by an LLM against your profile.
# Set enabled = false, or pass --no-llm, to rank by embedding similarity only.
enabled = true

# Local (default): Ollama (https://ollama.com), run `ollama pull mistral` first.
# Nothing leaves your machine, but expect ~30-60 s per paper on a laptop CPU.
provider = "ollama"
model = "mistral"

# Cloud: Claude via the Anthropic API. Seconds per paper; only public abstracts are sent.
# Requires `uv sync --extra anthropic` and ANTHROPIC_API_KEY.
# provider = "anthropic"
# model = "claude-opus-5-5"   # or e.g. "claude-haiku-4-5" for lower cost
# effort = "low"
candidates = 12      # the LLM assesses this many top papers by similarity
min_relevance = 3    # 1-5; papers rated lower are never shown
