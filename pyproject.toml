[project]
name = "paperpulse"
version = "2.0.0.dev0"
description = "Surface the most relevant new papers for your research interests"
authors = [{ name = "Engin Boz" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sentence-transformers>=5.0",
    "torch>=2.5",
]

[project.scripts]
paperpulse = "paperpulse.cli:main"

[project.urls]
Repository = "https://github.com/enginboz/paperpulse"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CPU-only torch on Linux: the default PyPI wheels pull in several GB of CUDA
# libraries, which is wasted on embedding a few hundred abstracts.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
